{% extends "base.html" %}
{% block body %}
<h1>Log in</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="username">Username</label>
  <input id="username" name="username" required maxlength="20" autocomplete="username">
  <label for="password">Password</label>
  <input id="password" type="password" name="password" required maxlength="128" autocomplete="current-password">
  <p><button type="submit">Log in</button></p>
</form>
{% endblock %}
