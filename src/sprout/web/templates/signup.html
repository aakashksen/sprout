{% extends "base.html" %}
{% block body %}
<h1>Sign up</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="username">Username (4-20 characters)</label>
  <input id="username" name="username" required minlength="4" maxlength="20" autocomplete="username">
  <label for="password">Password (8-128 characters)</label>
  <input id="password" type="password" name="password" required minlength="8" maxlength="128" autocomplete="new-password">
  <p><button type="submit">Create account</button></p>
</form>
{% endblock %}
